# Local development only. HTTP/signaling binds to loopback; media uses local NICs.
port: 7880
bind_addresses: [127.0.0.1]
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  # Do not force node_ip to 127.0.0.1: browsers need reachable NIC candidates.
  enable_loopback_candidate: true
keys:
  devkey: local-dev-secret-change-me-32-chars
logging:
  level: info
